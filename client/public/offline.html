<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offline • Zenith</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: #FAF8F5;
      color: #44403C;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
      padding: 20px;
    }
    .icon {
      font-size: 48px;
      margin-bottom: 16px;
    }
    h1 {
      font-size: 24px;
      margin: 0 0 8px;
      font-weight: 600;
    }
    p {
      color: #78716C;
      font-size: 15px;
      max-width: 360px;
      line-height: 1.5;
      margin: 0 0 24px;
    }
    button {
      background: #292524;
      color: #FAF8F5;
      border: none;
      padding: 12px 24px;
      border-radius: 9999px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="icon">🌿</div>
  <h1>You're currently offline</h1>
  <p>Zenith stores your to-dos locally so you can keep organizing. Reconnect to sync private messages.</p>
  <button onclick="window.location.reload()">Try Reconnecting</button>
</body>
</html>
